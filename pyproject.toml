[project]
name = "qwen-pwn"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Alexander Reinthal", email = "email@reinthal.me" }
]
requires-python = ">=3.14"
dependencies = [
    "duckdb>=2.0.0",
    "marimo>=0.25.2",
    "modal>=1.6.3",
    "njalla>=0.9.0",
    "pandas>=3.1.1",
    "plotly>=5.24",
]

[project.scripts]
qwen-pwn = "qwen_pwn:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
