[project]
name = "qwen-pwn"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Alexander Reinthal", email = "email@reinthal.me" }
]
requires-python = ">=3.13"
dependencies = [
    "agent-client-protocol>=0.10,<1",
    "datasets>=5.1.0",
    "duckdb>=2.0.0",
    "httpx>=0.28.1",
    "huggingface-hub>=2.4.0",
    "inspect-ai>=0.3.288",
    "marimo>=0.25.2",
    "modal>=1.6.3",
    "njalla>=0.9.0",
    "openai>=3.46.0",
    "pandas>=3.1.1",
    "plotly>=5.24",
    "pyarrow>=26.0.1",
    "requests>=2.34.2",
    "tldextract>=5.4.0",
    "tokenizers>=0.23.3",
]

[project.scripts]
qwen-pwn = "qwen_pwn:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
