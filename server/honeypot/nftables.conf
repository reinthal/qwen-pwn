#!/usr/sbin/nft -f
# Qwen honeypot host firewall. Rendered by deploy.sh (@SSH_PORTS@ replaced with
# the sshd ports detected via `ss`) and installed as /etc/nftables.conf ONLY if
# the live ruleset is empty. Forward/output chains are left at kernel default.

flush ruleset

table inet filter {
    chain input {
        type filter hook input priority filter; policy drop;

        iif "lo" accept
        ct state established,related accept

        # ICMP / ICMPv6 (incl. neighbour discovery) before the invalid drop.
        meta l4proto icmp accept
        meta l4proto ipv6-icmp accept

        ct state invalid drop

        # SSH
        tcp dport { @SSH_PORTS@ } accept

        # Authoritative DNS on the public addresses only
        ip  daddr 80.78.18.246 meta l4proto { tcp, udp } th dport 53 accept
        ip6 daddr 2a0a:3840:8078:18:0:504e:12f6:1337 meta l4proto { tcp, udp } th dport 53 accept

        # Honeypot HTTP(S) ports
        tcp dport { 80, 443, 9, 8000, 8080, 8082, 8090, 8099, 9999 } accept
    }
}
